name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: ""
        type: boolean
        default: false
      tag:
        description: ""
        type: string
        required: false
        default: "v1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (32-bit)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686

      - name: Build
        run: sh build.sh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BZDPatcher-win2000
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: BZDPatcher-win2000
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: BZDPatcher Win2000 ${{ inputs.tag }}
          files: |
            dist/BZDPatcher_Win2000_Setup.exe
            dist/XPSH.dll
            dist/reg.exe
          draft: false
          prerelease: false
